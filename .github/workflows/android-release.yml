name: Build signed Android App Bundle for Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || exit 1
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up private Firebase config and signing key
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for var in FIREBASE_GOOGLE_SERVICES_JSON_B64 ANDROID_UPLOAD_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "$(printenv "$var")" || { echo "Missing secret: $var"; exit 1; }
          done
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/catalyst-upload.jks"
          python - <<'PY'
          import json
          data=json.load(open('android/app/google-services.json',encoding='utf-8'))
          package='com.mirkottino83.catalystradar'
          clients=data.get('client', [])
          assert any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')==package for c in clients), "Firebase Android package ID mismatch"
          print("Firebase client package matches Android app")
          PY
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/catalyst-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:bundleRelease
      - name: Upload signed bundle privately to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-radar-play-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
