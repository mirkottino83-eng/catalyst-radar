name: Catalyst Radar remote controls

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: catalyst-radar-remote-controls
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Catalyst Radar control: ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate owner and apply exact control action
        env:
          CONTROL_ISSUE_TITLE: ${{ github.event.issue.title }}
          CONTROL_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          CONTROL_REPO_OWNER: ${{ github.repository_owner }}
        run: python scripts/apply_control.py
      - name: Persist control state
        run: |
          git config user.name "catalyst-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/control.json
          git commit -m "Update remote Catalyst Radar switches"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close authorized command issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Comando applicato. Torna su Catalyst Radar e premi Aggiorna dati per verificare il nuovo stato."
