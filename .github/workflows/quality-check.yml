name: Catalyst Radar quality check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/quality-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python scanner syntax
        run: python -m py_compile scripts/scanner.py
      - name: Verify JavaScript syntax
        run: node --check app.js
