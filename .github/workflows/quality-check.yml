name: Catalyst Radar quality check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/quality-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python scanner syntax
        run: python -m py_compile scripts/scanner.py scripts/history.py scripts/signal_quality.py scripts/push_alerts.py
      - name: Install lightweight test dependency
        run: pip install requests
      - name: Verify archived price calculations
        run: python -m unittest discover -s tests -v
      - name: Verify JavaScript syntax
        run: node --check app.js && node --check sw.js
