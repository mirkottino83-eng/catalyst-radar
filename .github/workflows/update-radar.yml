name: Update Catalyst Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scanner
        run: python scripts/scanner.py

      - name: Commit latest data
        run: |
          git config user.name "catalyst-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Catalyst Radar data"
            git push
          fi
