name: Update Catalyst Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-radar.yml'
  schedule:
    - cron: '2-59/5 * * * *' # best-effort five-minute scan; scheduled jobs can be delayed or skipped

permissions:
  contents: write

concurrency:
  group: catalyst-radar-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run scanner and optional ntfy push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/scanner.py

      - name: Commit latest data and persistent history
        run: |
          git config user.name "catalyst-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json data/alert_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Catalyst Radar data"
            git pull --rebase origin main
            git push
          fi
