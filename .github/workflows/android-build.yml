name: Android Play Store readiness

on:
  pull_request:
    paths: [ 'android/**', 'app.js', '.github/workflows/android-build.yml' ]
  push:
    branches: [main]
    paths: [ 'android/**', 'app.js', '.github/workflows/android-build.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" || exit 1
          "$SDK_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Build Android debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: catalyst-radar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
